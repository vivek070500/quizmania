{{define "content"}}
<div class="max-w-sm mx-auto pt-8 animate-fade-in">
    <div class="text-center mb-6">
        <div class="text-4xl mb-3">👋</div>
        <h1 class="text-2xl font-bold text-white">Welcome back</h1>
        <p class="text-neutral-400 text-sm mt-1">Log in to continue your streak</p>
    </div>

    <div class="card rounded-2xl p-6">
        <form method="POST" action="/login" class="space-y-4">
            <div>
                <label for="email" class="block text-xs font-medium text-neutral-300 mb-1.5 uppercase tracking-wide">Email</label>
                <input type="email" id="email" name="email" required
                    class="w-full px-3.5 py-2.5 bg-black border border-neutral-700 rounded-lg text-white placeholder-neutral-600 focus:outline-none focus:ring-2 focus:ring-white/30 focus:border-white/40 transition-all text-sm"
                    placeholder="you@example.com">
            </div>
            <div>
                <label for="password" class="block text-xs font-medium text-neutral-300 mb-1.5 uppercase tracking-wide">Password</label>
                <input type="password" id="password" name="password" required
                    class="w-full px-3.5 py-2.5 bg-black border border-neutral-700 rounded-lg text-white placeholder-neutral-600 focus:outline-none focus:ring-2 focus:ring-white/30 focus:border-white/40 transition-all text-sm"
                    placeholder="••••••••">
            </div>
            <button type="submit"
                class="w-full py-2.5 bg-white text-black text-sm font-semibold rounded-lg transition-all hover:bg-neutral-200">
                Log in
            </button>
        </form>

        <p class="text-center text-neutral-500 text-xs mt-5">
            No account? <a href="/register" class="text-white hover:underline font-medium">Sign up free</a>
        </p>
    </div>
</div>
{{end}}
