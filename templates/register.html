{{define "content"}}
<div class="max-w-sm mx-auto pt-8 animate-fade-in">
    <div class="text-center mb-6">
        <div class="text-4xl mb-3">🚀</div>
        <h1 class="text-2xl font-bold text-white">Join QuizMania</h1>
        <p class="text-neutral-400 text-sm mt-1">Create your account — takes 10 seconds</p>
    </div>

    <div class="card rounded-2xl p-6">
        <form method="POST" action="/register" class="space-y-4">
            <div>
                <label for="display_name" class="block text-xs font-medium text-neutral-300 mb-1.5 uppercase tracking-wide">Display Name</label>
                <input type="text" id="display_name" name="display_name" required maxlength="30"
                    class="w-full px-3.5 py-2.5 bg-black border border-neutral-700 rounded-lg text-white placeholder-neutral-600 focus:outline-none focus:ring-2 focus:ring-white/30 focus:border-white/40 transition-all text-sm"
                    placeholder="QuizMaster42">
            </div>
            <div>
                <label for="email" class="block text-xs font-medium text-neutral-300 mb-1.5 uppercase tracking-wide">Email</label>
                <input type="email" id="email" name="email" required
                    class="w-full px-3.5 py-2.5 bg-black border border-neutral-700 rounded-lg text-white placeholder-neutral-600 focus:outline-none focus:ring-2 focus:ring-white/30 focus:border-white/40 transition-all text-sm"
                    placeholder="you@example.com">
            </div>
            <div>
                <label for="password" class="block text-xs font-medium text-neutral-300 mb-1.5 uppercase tracking-wide">Password</label>
                <input type="password" id="password" name="password" required minlength="6"
                    class="w-full px-3.5 py-2.5 bg-black border border-neutral-700 rounded-lg text-white placeholder-neutral-600 focus:outline-none focus:ring-2 focus:ring-white/30 focus:border-white/40 transition-all text-sm"
                    placeholder="At least 6 characters">
            </div>
            <div>
                <label for="confirm_password" class="block text-xs font-medium text-neutral-300 mb-1.5 uppercase tracking-wide">Confirm Password</label>
                <input type="password" id="confirm_password" name="confirm_password" required minlength="6"
                    class="w-full px-3.5 py-2.5 bg-black border border-neutral-700 rounded-lg text-white placeholder-neutral-600 focus:outline-none focus:ring-2 focus:ring-white/30 focus:border-white/40 transition-all text-sm"
                    placeholder="••••••••">
            </div>
            <button type="submit"
                class="w-full py-2.5 bg-white text-black text-sm font-semibold rounded-lg transition-all hover:bg-neutral-200">
                Create account
            </button>
        </form>

        <p class="text-center text-neutral-500 text-xs mt-5">
            Already playing? <a href="/login" class="text-white hover:underline font-medium">Log in</a>
        </p>
    </div>
</div>
{{end}}
